# Model configuration
model:
  name: "gpt2"  # GPT-2 Small
  hidden_size: 768
  num_layers: 12
  vocab_size: 50257

# Dataset configuration
data:
  # Which frozen snapshot to use (see data/processed_versions/).
  # Set to null to use the working directory data/processed/.
  dataset_version: "v3_ca81135"
  num_cities: 20
  probes_per_city: 20
  forget_per_city: 5
  retain_per_city: 5
  # First-token probability threshold used during prompt verification.
  verification_threshold_first_token: 0.03  # 3% - GPT-2 often has low confidence even when it "knows" facts.

# Training configuration
training:
  probe:
    test_size: 0.2
    random_state: 42
  
  unlearning:
    ga:
      learning_rate: 1.0e-5
      max_epochs: 100
      target_prob: 0.01  # Stop when P(target) < 1% (as measured by target_mode below)
      retain_weight: 1.0  # Lambda for retain loss
      max_length: 64
      target_mode: "sequence_geomean"   # first_token | sequence_geomean
      early_stop_patience: 10
      # Optional: restrict which params GA updates (substring match). Example:
      # trainable_param_patterns: ["transformer.h.11", "lm_head"]
      trainable_param_patterns: null
  
    neglora:
      learning_rate: 1.0e-4
      max_epochs: 100
      target_prob: 0.01
      lora_rank: 8
      lora_alpha: 16
      target_modules: ["c_attn", "c_proj", "c_fc"]
      max_length: 64
      target_mode: "sequence_geomean"
      early_stop_patience: 10

# Experiment configuration
experiment:
  seeds: [0, 1, 2]  # Matches the multi-seed notebooks
  device: "cuda"  # or "cpu" / "mps"

# Causal tracing configuration
causal_tracing:
  noise_std_multiplier: 3.0  # Multiply embedding std by this
